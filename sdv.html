<template id="sdv-template-en"><article class="rpn-article">
<p>We are fragile.</p>
<p>From our very first breath, as we leave our mother’s womb, we are already confronted with an immutable reality: our physical existence can come to an end at any moment.</p>
<p>When we leave this world, we leave behind loved ones, projects, memories, and material possessions. But for many Swedes of foreign origin, deeply connected to more than one culture, another question may also become essential: <strong>where and how do we want to say our final goodbye?</strong></p>
<p>In Bamiléké culture in particular, the connection to the land of our ancestors continues to hold profound significance. For some, it is important to be able to return to their homeland after death. For others, what matters most is giving family members and loved ones—sometimes scattered across several countries—the opportunity to come together one last time around the person who has passed away.</p>
<p>This material and cultural concern also goes hand in hand with a more intimate and spiritual reflection: the lifelong preparation for the day when we meet our Creator.</p>
<p>It is in this spirit that the concept of <strong>Retour au Pays Natal (RPN) — Return to the Homeland</strong> developed within Cameroonian diaspora communities, particularly <a href="https://notrerpn.org/" target="_blank" rel="noopener">in Quebec (Canada)</a>. The objective was simple, yet powerful: to allow families to go through a period of mourning without having the financial burden of repatriation or funeral expenses added to the pain of losing someone they love.</p>
<p>An RPN system can, for example, help finance the repatriation of the deceased to Cameroon or support relatives living in different parts of the world so that they can come together for a final farewell, surrounded by family and community.</p>
<p>Over time, this idea has inspired other Cameroonian diaspora communities. Models developed in countries such as Germany (<a href="https://rpng.org/" target="_blank" rel="noopener"><strong>RPN Germany</strong></a>) demonstrate how a community can transform one of life’s most difficult experiences into a form of <strong>structured, responsible, and predictable solidarity</strong>.</p>
<p>The Cameroonian community in Sweden is gradually growing. It may therefore not be too early to begin thinking about our own model.</p>
<p>The Swedish initiative is inspired by the experience of RPN Canada and RPN Germany, but its ambition is deliberately broader. It is not intended to make repatriation to Cameroon the only possible outcome. Rather, the aim is to explore a solidarity mechanism that could support either the repatriation of the deceased to Cameroon or funeral and family-reunion arrangements in Sweden, according to the wishes of the deceased and their family. In this sense, RPN is an important source of inspiration and experience, but it does not necessarily define the name, structure or final form that a Swedish model should take. The ambition is to create a solution that respects both parts of our identity and the different ways in which individuals and families may wish to say their final farewell.</p>
<p>Beyond the support provided when someone passes away, such an initiative could also help strengthen the bonds within our community and increase our credibility as an organized and responsible community capable of building sustainable mechanisms of solidarity.</p>
<p>ABAS would therefore like to initiate a discussion around the following question:</p>
<p class="rpn-question"><strong>How could we develop, in Sweden, a mechanism inspired by RPN—starting within the Bamiléké community, but ideally, over time, extending its benefits to the wider Cameroonian community?</strong></p>
<p>The challenge is real. Our community remains considerably smaller than those in countries where such mechanisms have existed for many years.</p>
<p>This is precisely why this initiative does not begin with a predetermined solution.</p>
<p>Its purpose is to <strong>explore the different models that could be possible.</strong></p>
<p>One option could, for example, be a solidarity-based contribution system with a fixed minimum contribution, similar to some of the early RPN initiatives developed in Canada. Such a model could provide the community with a high degree of independence.</p>
<p>However, other possibilities also deserve to be explored: <strong>group insurance, a solidarity fund, a savings or investment mechanism, or a combination of several solutions.</strong></p>
<p>This reflection is also an opportunity to learn.</p>
<p>It can help us better understand Swedish legislation, insurance mechanisms, existing support systems, taxation, and the rules applicable to non-profit associations.</p>
<p>And above all, by carrying out this work together, we can create new connections within our community, share our skills and knowledge, and learn from one another.</p>
<p>The objective is therefore not simply to create an RPN.</p>
<p>It is to build <strong>a transparent, responsible, and sustainable model whose value and attractiveness can grow as the number of people participating increases.</strong></p>
<p>ABAS would like to establish a <strong>working group</strong> to explore these questions.</p>
<p>If you have experience in insurance, law, finance, taxation, association management—or simply the desire to contribute to this reflection—<strong>we invite you to contact ABAS and join the working group.</strong></p>
<p>The challenge is significant.</p>
<p class="rpn-closing"><strong>But the value of a community capable of supporting its members through the most difficult moments of life is immeasurable.</strong></p>
<p class="rpn-signoff">To you who wish to contribute: Ngue ping Teo. Atchamba.</p>

<template id="sdv-template-fr"><article class="rpn-article">
<p>Nous sommes fragiles.</p>
<p>Dès notre premier souffle, à la sortie du ventre de notre mère, nous sommes déjà confrontés à une réalité immuable : notre existence physique peut s’interrompre à tout instant.</p>
<p>Lorsque nous partons, nous laissons derrière nous des êtres aimés, des projets, des souvenirs et des biens matériels. Mais pour beaucoup de Suédois d’origine étrangère, profondément attachés à plusieurs cultures, une autre question peut également devenir essentielle : <strong>où et comment voulons-nous faire nos derniers adieux ?</strong></p>
<p>Dans la culture bamiléké, notamment, le lien avec la terre des ancêtres conserve une place profonde. Pour certains, il est important de pouvoir retourner au pays natal après le décès. Pour d’autres, l’essentiel est de permettre à la famille et aux proches, parfois dispersés à travers plusieurs pays, de se rassembler une dernière fois autour de la personne disparue.</p>
<p>Cette préoccupation matérielle et culturelle accompagne également une réflexion plus intime et spirituelle : celle de la préparation, tout au long de la vie, à la rencontre avec notre Créateur.</p>
<p>C’est dans cet esprit que le concept de <strong><a href="https://notrerpn.org/" target="_blank" rel="noopener">Retour au pays natal (RPN)</a></strong> s’est développé au sein de communautés camerounaises de la diaspora, notamment au <strong><a href="https://notrerpn.org/" target="_blank" rel="noopener">Québec (Canada)</a></strong>. L’objectif était simple mais puissant : permettre aux familles de traverser la période de deuil sans que le poids financier du rapatriement ou des funérailles ne vienne s’ajouter à la douleur de la perte.</p>
<p>Un système RPN peut notamment permettre de financer le retour du défunt au Cameroun ou d’aider les proches, parfois établis dans différentes parties du monde, à se réunir pour un dernier adieu entouré de la famille et de la communauté.</p>
<p>Au fil du temps, cette idée a inspiré d’autres diasporas camerounaises. Certains modèles, comme ceux développés en Allemagne (<a href="https://rpng.org/" target="_blank" rel="noopener"><strong>RPN Allemagne</strong></a>), montrent comment une communauté peut transformer une épreuve particulièrement difficile en une forme de solidarité structurée, responsable et prévisible.</p>
<p>La communauté camerounaise de Suède grandit progressivement. Il n’est donc peut-être pas trop tôt pour commencer à réfléchir à notre propre modèle.</p>
<p>L’initiative suédoise s’inspire de l’expérience du RPN au Canada et en Allemagne, mais son ambition est volontairement plus large. Il ne s’agit pas de faire du rapatriement au Cameroun la seule finalité possible. L’objectif est plutôt d’explorer un mécanisme de solidarité pouvant soutenir soit le rapatriement du défunt au Cameroun, soit l’organisation des funérailles et le rassemblement de la famille et des proches en Suède, selon les souhaits du défunt et de sa famille. Dans ce sens, le RPN constitue une source importante d’inspiration et d’expérience, sans nécessairement définir le nom, la structure ou la forme finale que devrait prendre un modèle suédois. L’ambition est de construire une solution qui respecte les différentes dimensions de notre identité ainsi que les différentes manières dont chacun peut souhaiter vivre son dernier adieu.</p>
<p>Au-delà de l’aide apportée lors d’un décès, une telle initiative pourrait également contribuer à renforcer nos liens internes et à accroître notre crédibilité en tant que communauté organisée, responsable et capable de construire des mécanismes de solidarité durables.</p>
<p>ABAS souhaite donc lancer une réflexion autour de la question suivante :</p>
<p class="rpn-question"><strong>Comment pourrions-nous développer en Suède un mécanisme inspiré du RPN, d’abord au sein de la communauté bamiléké, mais idéalement, à terme, au bénéfice d’une communauté camerounaise plus large ?</strong></p>
<p>Le défi est réel. Notre communauté reste beaucoup plus petite que celles de pays où ces mécanismes existent depuis plusieurs années. C’est précisément pour cette raison que cette activité ne part pas d’une solution prédéfinie.</p>
<p>Son objectif est d’explorer les différentes formules possibles.</p>
<p>Il pourrait s’agir, par exemple, d’un système de cotisation solidaire avec un montant minimum fixe, sur un modèle comparable aux premières initiatives RPN au Canada. Une telle formule offrirait une forte indépendance à la communauté.</p>
<p>Mais d’autres possibilités méritent également d’être étudiées : <strong>assurance collective, fonds de solidarité, mécanisme d’épargne ou d’investissement, ou encore combinaison de plusieurs solutions.</strong></p>
<p>Cette réflexion est aussi une occasion d’apprendre.</p>
<p>Elle nous permettra de mieux comprendre la législation suédoise, les mécanismes d’assurance, les systèmes de soutien existants, la fiscalité et les règles applicables aux associations.</p>
<p>Et surtout, en menant ce travail ensemble, nous pouvons créer de nouvelles connexions au sein de notre communauté, partager nos compétences et nous former mutuellement.</p>
<p>L’objectif n’est donc pas simplement de créer un RPN.</p>
<p>Il est de construire un modèle transparent, responsable et durable, dont la valeur et l’attractivité pourront grandir avec le nombre de personnes qui y participent.</p>
<p>ABAS souhaite constituer un groupe de travail pour explorer ces questions.</p>
<p>Si vous avez une expérience dans les domaines de l’assurance, du droit, de la finance, de la fiscalité, de la gestion associative — ou simplement l’envie de contribuer à cette réflexion — nous vous invitons à contacter ABAS et à rejoindre ce groupe de travail.</p>
<p>Le défi est important.</p>
<p class="rpn-closing"><strong>Mais la valeur d’une communauté capable de se soutenir dans les moments les plus difficiles est inestimable.</strong></p>
<p class="rpn-signoff">A toi qui souhaite t'impliquer, Ngue ping Teo. Atchamba.</p>

<template id="sdv-template-sv"><article class="rpn-article">
<p>Vi är sköra.</p>
<p>Redan från vårt allra första andetag, när vi lämnar vår mammas livmoder, möter vi en ofrånkomlig verklighet: vår fysiska existens kan upphöra när som helst.</p>
<p>När vi lämnar denna värld lämnar vi efter oss människor vi älskar, projekt, minnen och materiella tillgångar. Men för många svenskar med utländsk bakgrund, som känner en stark tillhörighet till flera kulturer, kan ytterligare en fråga bli betydelsefull: <strong>var och hur vill vi ta vårt sista farväl?</strong></p>
<p>I synnerhet inom bamilékékulturen har banden till förfädernas land fortfarande en djup betydelse. För vissa är det viktigt att kunna återvända till hemlandet efter sin död. För andra är det viktigaste att ge familj och närstående – ibland utspridda över flera länder – möjlighet att samlas en sista gång kring den person som har gått bort.</p>
<p>Denna materiella och kulturella fråga går också hand i hand med en mer personlig och andlig reflektion: den livslånga förberedelsen inför dagen då vi möter vår Skapare.</p>
<p>Det är i denna anda som konceptet <strong>Retour au Pays Natal (RPN) – Åter till hemlandet</strong> utvecklades inom kamerunska diasporagrupper, bland annat <a href="https://notrerpn.org/" target="_blank" rel="noopener">i Québec (Kanada)</a>. Målet var enkelt men kraftfullt: att göra det möjligt för familjer att gå igenom en sorgeperiod utan att de ekonomiska kostnaderna för repatriering eller begravning läggs ovanpå smärtan av att ha förlorat en närstående.</p>
<p>Ett RPN-system kan exempelvis bidra till att finansiera transporten av den avlidne tillbaka till Kamerun eller hjälpa anhöriga, som ibland är bosatta i olika delar av världen, att samlas för ett sista farväl tillsammans med familj och gemenskap.</p>
<p>Med tiden har idén inspirerat andra kamerunska diasporagrupper. Modeller som utvecklats i bland annat Tyskland (<a href="https://rpng.org/" target="_blank" rel="noopener"><strong>Tyskland</strong></a>) visar hur en gemenskap kan omvandla en av livets svåraste prövningar till en form av <strong>strukturerad, ansvarsfull och förutsägbar solidaritet</strong>.</p>
<p>Den kamerunska gemenskapen i Sverige växer gradvis. Det är därför kanske inte för tidigt att börja fundera över hur vår egen modell skulle kunna se ut.</p>
<p>Det svenska initiativet inspireras av erfarenheterna från RPN i Kanada och Tyskland, men ambitionen är medvetet bredare. Tanken är inte att återförande till Kamerun ska vara den enda möjliga lösningen. Syftet är i stället att undersöka en solidaritetsmodell som kan ge stöd antingen för återförande av den avlidne till Kamerun eller för begravning och möjlighet för familj och närstående att samlas i Sverige, utifrån den avlidnes och familjens önskemål. RPN är i detta avseende en viktig inspirations- och erfarenhetskälla, men behöver inte nödvändigtvis definiera namnet, strukturen eller den slutliga formen för en svensk modell. Ambitionen är att skapa en lösning som respekterar båda delarna av vår identitet och de olika sätt på vilka människor och familjer kan vilja ta sitt sista farväl.</p>
<p>Utöver det stöd som kan ges vid ett dödsfall skulle ett sådant initiativ också kunna bidra till att stärka banden inom vår gemenskap och öka vår trovärdighet som en organiserad och ansvarsfull gemenskap med förmåga att bygga hållbara solidaritetsmekanismer.</p>
<p>ABAS vill därför inleda en gemensam reflektion kring följande fråga:</p>
<p class="rpn-question"><strong>Hur skulle vi kunna utveckla en mekanism i Sverige inspirerad av RPN – till en början inom bamilékégemenskapen, men med ambitionen att den på längre sikt skulle kunna komma en bredare kamerunsk gemenskap till del?</strong></p>
<p>Utmaningen är verklig. Vår gemenskap är fortfarande betydligt mindre än de gemenskaper i andra länder där sådana system har funnits under många år.</p>
<p>Det är just därför detta initiativ inte utgår från en redan bestämd lösning.</p>
<p>Syftet är i stället att <strong>utforska olika möjliga modeller.</strong></p>
<p>Det skulle till exempel kunna handla om ett solidaritetsbaserat bidragssystem med ett fast minimibelopp, enligt en modell som påminner om de första RPN-initiativen i Kanada. En sådan lösning skulle kunna ge gemenskapen en hög grad av självständighet.</p>
<p>Men även andra möjligheter bör undersökas: <strong>gruppförsäkring, solidaritetsfond, sparande eller investeringar, eller en kombination av flera olika lösningar.</strong></p>
<p>Detta arbete är också en möjlighet att lära oss mer.</p>
<p>Det kan ge oss en bättre förståelse för svensk lagstiftning, försäkringslösningar, befintliga stödsystem, beskattning och de regler som gäller för ideella föreningar.</p>
<p>Och framför allt kan vi, genom att arbeta tillsammans, skapa nya kontakter inom vår gemenskap, dela med oss av våra kunskaper och erfarenheter och lära av varandra.</p>
<p>Målet är därför inte enbart att skapa ett RPN.</p>
<p>Målet är att bygga <strong>en transparent, ansvarsfull och hållbar modell vars värde och attraktionskraft kan växa i takt med att fler människor deltar.</strong></p>
<p>ABAS vill därför bilda en <strong>arbetsgrupp</strong> för att undersöka dessa frågor.</p>
<p>Om du har erfarenhet inom försäkring, juridik, ekonomi, beskattning, föreningsverksamhet – eller helt enkelt vill bidra till denna gemensamma reflektion – <strong>välkomnar vi dig att kontakta ABAS och bli en del av arbetsgruppen.</strong></p>
<p>Utmaningen är stor.</p>
<p class="rpn-closing"><strong>Men värdet av en gemenskap som kan stötta sina medlemmar i livets allra svåraste stunder är ovärderligt.</strong></p>
<p class="rpn-signoff">Till dig som vill engagera dig: Ngue ping Teo. Atchamba.</p>
