<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ABAS — My profile</title>
  <link rel="stylesheet" href="styles.css?v=15">
</head>
<body class="portal-page">
<main class="portal-card portal-card-wide">
  <a href="members.html" class="back-link">← Member area</a>
  <img src="assets/logo-sv-ng.svg" class="portal-logo" alt="ABAS">
  <h1>My member profile</h1>
  <p>Update your personal membership information.</p>
  <div id="authMessage" class="auth-message" hidden></div>
  <form class="portal-form" id="profileForm">
    <div class="contact-grid">
      <label>First name<input id="firstName" type="text" autocomplete="given-name" required></label>
      <label>Last name<input id="lastName" type="text" autocomplete="family-name" required></label>
    </div>
    <div class="contact-grid">
      <label>Phone<input id="phone" type="tel" autocomplete="tel"></label>
      <label>City<input id="city" type="text" autocomplete="address-level2"></label>
    </div>
    <label>Email<input id="email" type="email" disabled></label>
    <div class="member-meta" id="memberMeta"></div>
    <button class="btn primary" id="saveButton" type="submit">Save changes</button>
  </form>
  <div class="portal-links"><a href="forgot-password.html">Change/reset password</a><button class="link-button" id="logoutButton" type="button">Sign out</button></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script src="profile.js"></script>
</body>
</html>
