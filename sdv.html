<template id="sdv-template-en"><article class="rpn-article sdv-short">
<p class="sdv-lead"><strong>Two homelands, one bond.</strong> For many people in the diaspora, a final farewell may mean returning to Cameroon — or remaining in Sweden so family and loved ones can gather here.</p>
<p><strong>Final Journey Solidarity (SDV)</strong> is ABAS’s exploration of a practical solidarity model that could help families face these choices without adding avoidable financial and organisational pressure to grief.</p>
<p>The initiative is inspired by <a href="https://notrerpn.org/" target="_blank" rel="noopener">RPN Canada</a> and <a href="https://rpng.org/" target="_blank" rel="noopener">RPN Germany</a>, but the Swedish approach is deliberately broader: <strong>repatriation is not the only outcome.</strong> Support could also concern funeral and family-gathering arrangements in Sweden, according to the wishes of the deceased and the family.</p>
<div class="sdv-focus"><h2>What ABAS is exploring</h2><ul><li>Group insurance</li><li>A solidarity fund or member contribution model</li><li>Savings/investment approaches</li><li>A combination of solutions adapted to Swedish rules</li></ul></div>
<p>ABAS is building a working group to examine the legal, insurance, financial and practical options. <strong>No final model is assumed at this stage.</strong></p>
<p class="rpn-signoff">Ngue ping Teo. Atchamba.</p>

<template id="sdv-template-fr"><article class="rpn-article sdv-short">
<p class="sdv-lead"><strong>Deux terres, un même lien.</strong> Pour de nombreuses personnes de la diaspora, le dernier adieu peut signifier un retour au Cameroun — ou des funérailles en Suède afin que la famille et les proches puissent s’y réunir.</p>
<p><strong>Solidarité Dernier Voyage (SDV)</strong> est une réflexion portée par ABAS sur un mécanisme de solidarité pratique pouvant aider les familles à faire face à ces choix sans ajouter une charge financière et organisationnelle évitable au deuil.</p>
<p>L’initiative s’inspire du <a href="https://notrerpn.org/" target="_blank" rel="noopener">RPN Canada</a> et du <a href="https://rpng.org/" target="_blank" rel="noopener">RPN Allemagne</a>, mais l’approche suédoise est volontairement plus large : <strong>le rapatriement n’est pas la seule finalité.</strong> Le soutien pourrait aussi concerner les funérailles et le rassemblement des proches en Suède, selon les souhaits du défunt et de sa famille.</p>
<div class="sdv-focus"><h2>Ce qu’ABAS souhaite étudier</h2><ul><li>Une assurance collective</li><li>Un fonds de solidarité ou un système de cotisation</li><li>Des mécanismes d’épargne ou d’investissement</li><li>Une combinaison de solutions adaptée au cadre suédois</li></ul></div>
<p>ABAS souhaite réunir un groupe de travail pour étudier les aspects juridiques, assurantiels, financiers et pratiques. <strong>Aucun modèle définitif n’est présupposé à ce stade.</strong></p>
<p class="rpn-signoff">Ngue ping Teo. Atchamba.</p>

<template id="sdv-template-sv"><article class="rpn-article sdv-short">
<p class="sdv-lead"><strong>Två hemländer, ett band.</strong> För många i diasporan kan det sista farvälet innebära återförande till Kamerun — eller begravning i Sverige så att familj och närstående kan samlas här.</p>
<p><strong>Solidaritet för den sista resan (SDV)</strong> är ABAS:s undersökning av en praktisk solidaritetsmodell som kan hjälpa familjer att hantera dessa val utan att sorgens börda förstärks av onödiga ekonomiska och organisatoriska problem.</p>
<p>Initiativet inspireras av <a href="https://notrerpn.org/" target="_blank" rel="noopener">RPN Kanada</a> och <a href="https://rpng.org/" target="_blank" rel="noopener">RPN Tyskland</a>, men den svenska modellen är medvetet bredare: <strong>återförande är inte det enda möjliga utfallet.</strong> Stödet kan också avse begravning och familjesamling i Sverige, utifrån den avlidnes och familjens önskemål.</p>
<div class="sdv-focus"><h2>Det ABAS vill undersöka</h2><ul><li>Gruppförsäkring</li><li>Solidaritetsfond eller medlemsbaserat bidragssystem</li><li>Sparande eller investeringar</li><li>En kombination av lösningar anpassad till svenska regler</li></ul></div>
<p>ABAS vill samla en arbetsgrupp för att undersöka juridiska, försäkringsmässiga, ekonomiska och praktiska alternativ. <strong>Ingen slutlig modell är bestämd i detta skede.</strong></p>
<p class="rpn-signoff">Ngue ping Teo. Atchamba.</p>
